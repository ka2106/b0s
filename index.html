<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>БОС · Сравнение версий</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<style>
:root{
  --bg:#f8fafc;
  --surface:#ffffff;
  --border:#e2e8f0;
  --border-strong:#cbd5e1;
  --text:#0f172a;
  --text-muted:#64748b;
  --text-dim:#94a3b8;
  --accent:#2563eb;
  --accent-hover:#1d4ed8;
  --accent-soft:#eff6ff;
  --old:#b91c1c;
  --old-bg:#fef2f2;
  --new:#15803d;
  --new-bg:#f0fdf4;
  --shadow-sm:0 1px 2px rgba(15,23,42,.04);
  --shadow:0 1px 3px rgba(15,23,42,.08),0 1px 2px rgba(15,23,42,.04);
  --radius:10px;
  --radius-sm:6px;
  --font-mono:'SF Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  background:var(--bg);color:var(--text);
  font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.container{max-width:1320px;margin:0 auto;padding:0 32px}
@media(max-width:768px){.container{padding:0 16px}}

/* ============ Header ============ */
header{
  background:#0f172a;color:#fff;
  padding:20px 0;
  border-bottom:3px solid var(--accent);
}
.header-inner{display:flex;align-items:center;gap:14px}
.logo-mark{
  width:34px;height:34px;border-radius:8px;
  background:var(--accent);
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:16px;color:#fff;letter-spacing:-.5px;
}
.header-text h1{font-size:17px;font-weight:600;margin:0;letter-spacing:-.01em;}
.header-text p{font-size:12px;color:#94a3b8;margin:2px 0 0;font-weight:400;}

/* ============ Main ============ */
main{padding:32px 0 60px}

/* Mode Selector */
.mode-selector{
  display:flex;justify-content:center;gap:24px;margin-bottom:24px;
  background:var(--surface);padding:12px 24px;border-radius:var(--radius);
  border:1px solid var(--border);box-shadow:var(--shadow-sm);
  width:fit-content;margin-left:auto;margin-right:auto;
}
.mode-selector label{
  display:flex;align-items:center;gap:8px;cursor:pointer;
  font-weight:500;color:var(--text-muted);transition:color .15s;
}
.mode-selector input[type="radio"]{
  width:16px;height:16px;accent-color:var(--accent);cursor:pointer;
}
.mode-selector label:hover{color:var(--text);}
.mode-selector input[type="radio"]:checked + span{color:var(--accent);font-weight:600;}

/* Upload screen */
.upload-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:20px;
  margin-bottom:24px;
}
@media(max-width:768px){.upload-grid{grid-template-columns:1fr}}

.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:24px;
  display:flex;
  flex-direction:column;
}
.card-header{
  display:flex;align-items:center;gap:12px;
  margin-bottom:20px;padding-bottom:16px;
  border-bottom:1px solid var(--border);
}
.card-icon{
  width:36px;height:36px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:700;flex-shrink:0;
}
.card-icon.g{background:#eff6ff;color:#2563eb}
.card-icon.x{background:#f0fdf4;color:#15803d}
.card-title{font-size:15px;font-weight:600;margin:0}
.card-sub{font-size:12px;color:var(--text-muted);margin:2px 0 0}

.field{margin-bottom:14px}
.field-label{
  display:block;font-size:11px;font-weight:600;color:var(--text-muted);
  text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;
}
.field input[type=text]{
  width:100%;padding:9px 12px;
  border:1px solid var(--border);border-radius:var(--radius-sm);
  font-size:13px;font-family:inherit;color:var(--text);
  background:var(--surface);
  transition:border-color .15s,box-shadow .15s;
}
.field input[type=text]:focus{
  outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-soft);
}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:9px 16px;border:none;border-radius:var(--radius-sm);
  font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;
  transition:background .15s,box-shadow .15s,opacity .15s;
}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover:not(:disabled){background:var(--accent-hover)}
.btn-secondary{background:var(--surface);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover:not(:disabled){background:#f1f5f9}
.btn-full{width:100%}
.btn-lg{padding:12px 32px;font-size:14px}

.divider{
  position:relative;text-align:center;margin:14px 0;
  font-size:11px;color:var(--text-dim);text-transform:uppercase;
  letter-spacing:.05em;
}
.divider::before,.divider::after{
  content:'';position:absolute;top:50%;width:calc(50% - 30px);height:1px;
  background:var(--border);
}
.divider::before{left:0}
.divider::after{right:0}

/* Исправленный дизайн Drop Zone */
.drop-zone{
  border:1.5px dashed var(--border-strong);
  border-radius:var(--radius-sm);
  padding:24px 20px;
  text-align:center;
  cursor:pointer;
  background:var(--surface);
  transition:all .15s;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:8px;
  width:100%;
  min-height:130px;
  flex-grow:1;
}
.drop-zone:hover,.drop-zone.drag{
  border-color:var(--accent);background:var(--accent-soft);
}
.drop-zone.has-file{border-color:var(--new);background:var(--new-bg);border-style:solid}
.drop-zone input{display:none}
.drop-icon{font-size:24px;color:var(--text-muted);margin-bottom:4px;}
.drop-zone:hover .drop-icon{color:var(--accent);}
.drop-text{font-size:13px;color:var(--text-muted);line-height:1.4;}
.drop-text strong{color:var(--accent);font-weight:600}
.drop-filename{font-size:12px;font-weight:600;color:var(--new);margin-top:4px;word-break:break-all;}

.status-msg{
  margin-top:12px;padding:8px 12px;border-radius:var(--radius-sm);
  font-size:12px;display:none;
}
.status-msg.show{display:block}
.status-msg.error{background:var(--old-bg);color:var(--old);border:1px solid #fecaca}
.status-msg.success{background:var(--new-bg);color:var(--new);border:1px solid #bbf7d0}
.status-msg.loading{background:var(--accent-soft);color:var(--accent);border:1px solid #bfdbfe}

.compare-bar{text-align:center;padding:8px 0}

/* ============ Report ============ */
.report-header{
  display:flex;justify-content:space-between;align-items:flex-start;
  gap:16px;margin-bottom:24px;flex-wrap:wrap;
}
.report-title{font-size:20px;font-weight:600;margin:0;letter-spacing:-.01em}
.report-meta{color:var(--text-muted);font-size:13px;margin:6px 0 0}
.report-actions{display:flex;gap:8px}

.summary{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:12px;margin-bottom:24px;
}
.stat{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:16px 20px;
  box-shadow:var(--shadow-sm);border-left:3px solid var(--border-strong);
}
.stat.blue{border-left-color:var(--accent)}
.stat.yellow{border-left-color:#f59e0b}
.stat.green{border-left-color:var(--new)}
.stat.red{border-left-color:var(--old)}
.stat-label{
  font-size:11px;font-weight:600;color:var(--text-muted);
  text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;
}
.stat-value{
  font-size:24px;font-weight:700;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;line-height:1;
}
.stat-detail{font-size:11px;color:var(--text-muted);margin-top:6px}

.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:0;}
.tab{
  padding:11px 18px;background:transparent;border:none;cursor:pointer;
  font-size:13px;font-weight:500;color:var(--text-muted);font-family:inherit;
  border-bottom:2px solid transparent;margin-bottom:-1px;
  transition:color .15s,border-color .15s;
}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.tab-count{
  display:inline-block;padding:1px 7px;border-radius:10px;
  background:#f1f5f9;color:var(--text-muted);font-size:11px;
  font-weight:600;margin-left:6px;font-variant-numeric:tabular-nums;
}
.tab.active .tab-count{background:var(--accent-soft);color:var(--accent)}

.panel{
  background:var(--surface);border:1px solid var(--border);border-top:none;
  border-radius:0 0 var(--radius) var(--radius);padding:16px;
}
.panel.hidden{display:none}
.panel-note{
  font-size:12px;color:var(--text-muted);padding:10px 12px;
  background:#f8fafc;border-radius:var(--radius-sm);
  border-left:2px solid var(--border-strong);margin-bottom:12px;
}

.toolbar{display:flex;gap:10px;margin-bottom:12px;align-items:center;flex-wrap:wrap;}
input.filter{
  padding:8px 12px;border:1px solid var(--border);
  border-radius:var(--radius-sm);font-size:13px;
  width:320px;font-family:inherit;color:var(--text);
  transition:border-color .15s,box-shadow .15s;
}
input.filter:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.row-count{color:var(--text-muted);font-size:12px;margin-left:auto;font-variant-numeric:tabular-nums;}

.table-wrap{
  max-height:68vh;overflow:auto;
  border:1px solid var(--border);border-radius:var(--radius-sm);
  background:var(--surface);
}
table{border-collapse:collapse;width:100%;font-size:12.5px}
thead th{
  background:#f8fafc;color:var(--text-muted);
  padding:10px 12px;text-align:left;
  font-size:11px;font-weight:600;text-transform:uppercase;
  letter-spacing:.04em;cursor:pointer;position:sticky;top:0;z-index:1;
  white-space:nowrap;user-select:none;border-bottom:1px solid var(--border);
}
thead th:hover{background:#f1f5f9}
tbody td{
  padding:9px 12px;border-bottom:1px solid var(--border);
  vertical-align:top;color:var(--text);
}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:#f8fafc}

.old-val{
  color:var(--old);background:var(--old-bg);padding:1px 6px;border-radius:4px;
  font-size:12px;font-weight:500;font-variant-numeric:tabular-nums;
}
.new-val{
  color:var(--new);background:var(--new-bg);padding:1px 6px;border-radius:4px;
  font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;
}
.arrow{color:var(--text-dim);margin:0 2px}
.num{font-variant-numeric:tabular-nums}
.empty{padding:48px;text-align:center;color:var(--text-muted);font-size:13px;}
.empty-icon{font-size:28px;margin-bottom:8px;opacity:.4}

code{
  background:#f1f5f9;padding:1px 6px;border-radius:4px;
  font-size:12px;font-family:var(--font-mono);border:1px solid var(--border);
}

footer{text-align:center;padding:24px 0;color:var(--text-dim);font-size:11px;border-top:1px solid var(--border);margin-top:40px;}
</style>
</head>
<body>

<header>
  <div class="container header-inner">
    <div class="logo-mark">Б</div>
    <div class="header-text">
      <h1>БОС · Сравнение версий</h1>
      <p>Инструмент актуализации данных</p>
    </div>
  </div>
</header>

<main>
<div class="container">

<div id="screen-upload">
  
  <!-- Переключатель режимов -->
  <div class="mode-selector">
    <label>
      <input type="radio" name="compare-mode" value="g_vs_x" checked>
      <span>Google Sheets ↔ Excel</span>
    </label>
    <label>
      <input type="radio" name="compare-mode" value="x_vs_x">
      <span>Excel ↔ Excel (старая vs новая)</span>
    </label>
  </div>

  <div class="upload-grid">

    <!-- ЛЕВАЯ КАРТОЧКА -->
    <div class="card" id="card-left">
      <div class="card-header">
        <div class="card-icon g" id="left-icon">G</div>
        <div>
          <div class="card-title" id="left-title">Google Sheets</div>
          <div class="card-sub" id="left-sub">Авто-загрузка или файл .xlsx</div>
        </div>
      </div>

      <div id="google-fields">
        <div class="field">
          <label class="field-label">Sheet ID</label>
          <input type="text" id="gsheet-id" value="1mDdg8Z1KpH8iDbf9PMnqnEA0dp_FZY1T1ab0RpY0etM" placeholder="ID из URL таблицы">
        </div>
        <div class="field">
          <label class="field-label">Имя листа</label>
          <input type="text" id="gsheet-name" value="data">
        </div>
        <button class="btn btn-primary btn-full" id="btn-load-g" style="margin-bottom:14px;">
          Загрузить из Google Sheets
        </button>
        <div class="divider">или загрузите файл</div>
      </div>

      <label class="drop-zone" id="dz-left">
        <input type="file" id="file-left" accept=".xlsx">
        <div class="drop-icon">📄</div>
        <div class="drop-text">Перетащите <strong>.xlsx</strong> или нажмите</div>
        <div class="drop-filename" id="fn-left"></div>
      </label>

      <div class="status-msg" id="status-left"></div>
    </div>

    <!-- ПРАВАЯ КАРТОЧКА -->
    <div class="card" id="card-right">
      <div class="card-header">
        <div class="card-icon x" id="right-icon">X</div>
        <div>
          <div class="card-title" id="right-title">Excel-файл</div>
          <div class="card-sub" id="right-sub">Лист «Данные»</div>
        </div>
      </div>

      <div class="field">
        <label class="field-label">Файл .xlsx</label>
      </div>

      <label class="drop-zone" id="dz-right">
        <input type="file" id="file-right" accept=".xlsx">
        <div class="drop-icon">📄</div>
        <div class="drop-text">Перетащите <strong>.xlsx</strong> или нажмите</div>
        <div class="drop-filename" id="fn-right"></div>
      </label>

      <div class="status-msg" id="status-right"></div>
    </div>

  </div>

  <div class="compare-bar">
    <button class="btn btn-primary btn-lg" id="btn-run" disabled>
      Сравнить данные
    </button>
  </div>
</div>

<div id="screen-report" style="display:none">
  <div class="report-header">
    <div>
      <h2 class="report-title">Результат сравнения</h2>
      <p class="report-meta" id="report-meta"></p>
    </div>
    <div class="report-actions">
      <button class="btn btn-secondary" id="btn-back">← Назад</button>
      <button class="btn btn-primary" id="btn-dl-xlsx">Скачать Excel</button>
    </div>
  </div>
  <div id="report-content"></div>
</div>

</div>
</main>

<footer>Все вычисления происходят локально в браузере</footer>

<script>
'use strict';

const $ = id => document.getElementById(id);
const NUM_FMT = new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 2 });

const esc = s => {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
};

const fmtVal = v => {
  if (v === null || v === undefined || v === '') return '';
  if (typeof v === 'number') return NUM_FMT.format(v);
  return String(v);
};

const rv = (s, cls) => {
  if (s === null || s === undefined || s === '') return '';
  return `<span class="${cls}">${esc(fmtVal(s))}</span>`;
};

function setStatus(id, msg, type) {
  const el = $(id);
  if (!msg) { el.className = 'status-msg'; el.textContent = ''; return; }
  el.className = 'status-msg show ' + type;
  el.textContent = msg;
}

function setCardReady(cardId, ready) {
  const c = $(cardId);
  if (ready) c.style.borderColor = 'var(--new)';
  else c.style.borderColor = 'var(--border)';
}

const state = { leftData: null, rightData: null, mode: 'g_vs_x' };

// ============ Режимы интерфейса ============
document.querySelectorAll('input[name="compare-mode"]').forEach(radio => {
  radio.addEventListener('change', e => {
    state.mode = e.target.value;
    const isGvsX = state.mode === 'g_vs_x';
    
    // Левая сторона
    $('google-fields').style.display = isGvsX ? 'block' : 'none';
    $('left-icon').className = isGvsX ? 'card-icon g' : 'card-icon x';
    $('left-icon').textContent = isGvsX ? 'G' : 'X';
    $('left-title').textContent = isGvsX ? 'Google Sheets' : 'Excel-файл (Старый)';
    $('left-sub').textContent = isGvsX ? 'Авто-загрузка или файл .xlsx' : 'Лист «Данные»';
    
    // Правая сторона
    $('right-title').textContent = isGvsX ? 'Excel-файл' : 'Excel-файл (Новый)';
    $('right-sub').textContent = isGvsX ? 'Лист «Данные»' : 'Лист «Данные»';
    
    // Сброс загруженных данных
    state.leftData = null;
    state.rightData = null;
    $('fn-left').textContent = '';
    $('fn-right').textContent = '';
    $('dz-left').classList.remove('has-file');
    $('dz-right').classList.remove('has-file');
    setStatus('status-left', '', '');
    setStatus('status-right', '', '');
    setCardReady('card-left', false);
    setCardReady('card-right', false);
    updateButtons();
  });
});

function updateButtons() {
  $('btn-run').disabled = !(state.leftData && state.rightData);
}

// ============ Парсинг и нормализация ============
function findLatestSuffix(headers) {
  const text = headers.join(' | ');
  const matches = [...text.matchAll(/\((\d{2})\.(\d{2})\.(\d{4})\)/g)];
  if (!matches.length) return null;
  const sorted = matches.map(m => ({ full: m[0], ts: new Date(`${m[3]}-${m[2]}-${m[1]}`).getTime() }))
                        .sort((a, b) => b.ts - a.ts);
  return sorted[0].full;
}

function findCol(headers, prefix, suffix = null) {
  const p = prefix.replace(/\s+/g, ' ').trim().toLowerCase();
  for (const h of headers) {
    if (!h) continue;
    const hn = h.replace(/\s+/g, ' ').trim();
    const hnl = hn.toLowerCase();
    if (!hnl.startsWith(p)) continue;
    if (suffix === null) {
      if (!/\(\d{2}\.\d{2}\.\d{4}\)/.test(hn)) return h;
    } else if (hn.includes(suffix)) return h;
  }
  return null;
}

function findColExact(headers, name) {
  const target = name.replace(/\s+/g, ' ').trim().toLowerCase();
  for (const h of headers) {
    if (h && h.replace(/\s+/g, ' ').trim().toLowerCase() === target) return h;
  }
  return null;
}

function getColumnMapping(headers) {
  const suffix = findLatestSuffix(headers);
  return {
    'id': findColExact(headers, 'id'),
    'ФО': findColExact(headers, 'ФО'),
    'объект': findColExact(headers, 'Объект'),
    'этап': findCol(headers, 'Наименование этапа', suffix),
    'статус': findColExact(headers, 'Статус площади'),
    'общая площадь': findCol(headers, 'Общая площадь', suffix),
    'площадь строительства': findCol(headers, 'Площадь объекта строительства', suffix),
    'площадь блоков мезонина': findCol(headers, 'Площадь блоков мезонина'),
    'площадь оперзоны': findCol(headers, 'Площадь оперзоны'),
    'площадь заморозки': findCol(headers, 'Площадь заморозки', suffix),
    'статус площадки': findCol(headers, 'Статус площадки', suffix),
    'РВ': findCol(headers, 'Дата получения РВ', suffix),
    'категория': findColExact(headers, 'Категория объекта'),
    'источник': findCol(headers, 'Источник данных площади объекта', suffix),
    'повреждения': findColExact(headers, 'Повреждение блока'),
  };
}

function normalizeValue(v) {
  if (v === null || v === undefined || v === '') return null;
  if (v instanceof Date) {
    const y = v.getUTCFullYear();
    const m = String(v.getUTCMonth() + 1).padStart(2, '0');
    const d = String(v.getUTCDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
  }
  if (typeof v === 'number') return v;
  if (typeof v === 'string') return v.replace(/[\u200B-\u200D\uFEFF]/g, '').replace(/\u00A0/g, ' ').trim();
  if (typeof v === 'object') {
    if (v.richText) return v.richText.map(r => r.text).join('').replace(/[\u200B-\u200D\uFEFF]/g, '').trim();
    if (v.text !== undefined) return String(v.text).replace(/[\u200B-\u200D\uFEFF]/g, '').trim();
    if (v.result !== undefined) return normalizeValue(v.result);
  }
  return String(v).replace(/[\u200B-\u200D\uFEFF]/g, '').trim();
}

function normalizeId(v) {
  if (v === null || v === undefined || v === '') return null;
  if (typeof v === 'number') return Number.isInteger(v) ? String(v) : String(Math.trunc(v));
  return String(v).trim();
}

function normalizeObject(v) {
  if (v === null || v === undefined) return null;
  return String(v).trim().replace(/^БВС\s+/i, '').replace(/\s+БВС$/i, '');
}

function tryNum(x) {
  if (x === null || x === undefined) return { ok: false, n: null };
  if (typeof x === 'number') return Number.isFinite(x) ? { ok: true, n: x } : { ok: false, n: null };
  if (typeof x !== 'string') return { ok: false, n: null };
  const s = x.trim();
  if (s === '' || s === '-' || s === '—' || s === '.') return { ok: false, n: null };
  const cleaned = s.replace(/[\u00a0\u202f\s]/g, '').replace(',', '.');
  const n = Number(cleaned);
  return Number.isFinite(n) ? { ok: true, n } : { ok: false, n: null };
}

function valuesEqual(a, b) {
  const A = tryNum(a), B = tryNum(b);
  if (A.ok && B.ok) return NUM_FMT.format(A.n) === NUM_FMT.format(B.n);
  const isE = x => x === null || x === undefined || (typeof x === 'string' && x.trim() === '');
  const eA = isE(a), eB = isE(b);
  if (eA && eB) return true;
  if (eA || eB) return false;
  return String(a).trim() === String(b).trim();
}

// ============ Загрузчики ============
function extractSheetId(input) {
  input = input.trim();
  const m = input.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
  return m ? m[1] : input;
}

function parseGviz(data) {
  const t = data.table;
  const headers = t.cols.map(c => (c.label || c.id || '').replace(/\s+/g, ' ').trim());
  const rows = [];
  (t.rows || []).forEach((r, idx) => {
    const obj = { __row: idx + 2 };
    let hasValue = false;
    (r.c || []).forEach((cell, i) => {
      if (i >= headers.length || !headers[i]) return;
      let v = null;
      if (cell && cell.v !== undefined && cell.v !== null && cell.v !== '') {
        const raw = cell.v;
        if (typeof raw === 'string' && raw.startsWith('Date(')) {
          const m = raw.match(/Date\((\d+),(\d+),(\d+)/);
          if (m) v = `${m[1]}-${String(parseInt(m[2])+1).padStart(2,'0')}-${String(parseInt(m[3])).padStart(2,'0')}`;
        } else v = raw;
      } else if (cell && cell.f) {
        const f = String(cell.f).trim();
        if (f && !/^-?[\d\s,\.]+$/.test(f)) v = f;
      }
      obj[headers[i]] = v;
      if (v !== null && v !== '') hasValue = true;
    });
    if (hasValue) rows.push(obj);
  });
  return { headers: headers.filter(Boolean), rows };
}

async function readXlsx(file, preferredSheets) {
  const buf = await file.arrayBuffer();
  const wb = new ExcelJS.Workbook();
  await wb.xlsx.load(buf);
  let ws = null;
  for (const name of preferredSheets) { ws = wb.getWorksheet(name); if (ws) break; }
  if (!ws) ws = wb.worksheets[0];
  if (!ws) throw new Error('В файле нет листов');

  const headers = [];
  const headerRow = ws.getRow(1);
  const lastCol = Math.max(ws.columnCount || 0, 60);
  for (let col = 1; col <= lastCol; col++) {
    const cell = headerRow.getCell(col);
    let v = cell ? cell.value : null;
    if (v === null || v === undefined || v === '') {
      const txt = cell.text;
      if (txt && txt !== '') v = txt;
    }
    if (v && typeof v === 'object' && !(v instanceof Date)) {
      if (v.richText) v = v.richText.map(r => r.text).join('');
      else if (v.text !== undefined) v = v.text;
      else if (v.result !== undefined) v = v.result;
    }
    let str = v == null ? '' : String(v).replace(/\s+/g, ' ').trim();
    if (!str && cell) {
      const txt = cell.text;
      if (txt) str = String(txt).replace(/\s+/g, ' ').trim();
    }
    headers[col] = str;
  }

  const rows = [];
  ws.eachRow((row, rn) => {
    if (rn === 1) return;
    const obj = { __row: rn };
    let hasValue = false;
    row.eachCell({ includeEmpty: false }, (cell, col) => {
      let v = cell.value;
      if (v === null || v === undefined || v === '') {
        const txt = cell.text;
        if (txt && txt !== '') v = txt;
      }
      if (v && typeof v === 'object' && !(v instanceof Date)) {
        if (v.richText) v = v.richText.map(r => r.text).join('');
        else if (v.text !== undefined) v = v.text;
        else if (v.result !== undefined) v = v.result;
      }
      const h = headers[col];
      if (h) {
        obj[h] = v;
        if (v !== null && v !== undefined && v !== '') hasValue = true;
      }
    });
    if (hasValue) rows.push(obj);
  });
  return { headers: headers.filter(Boolean), rows };
}

function loadGoogleSheet(sheetId, sheetName = 'data') {
  return new Promise((resolve, reject) => {
    const cbName = 'gviz_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
    const timeout = setTimeout(() => { delete window[cbName]; reject(new Error('Таймаут 30 сек.')); }, 30000);
    window[cbName] = data => {
      clearTimeout(timeout); delete window[cbName];
      try {
        if (!data || !data.table) return reject(new Error('Пустой ответ. Проверьте доступ.'));
        const parsed = parseGviz(data);
        if (!parsed.rows.length) return reject(new Error('Нет данных. Проверьте имя листа.'));
        resolve(parsed);
      } catch (e) { reject(e); }
    };
    const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=responseHandler:${cbName}&sheet=${encodeURIComponent(sheetName)}&headers=1`;
    const script = document.createElement('script');
    script.src = url;
    script.onerror = () => { clearTimeout(timeout); delete window[cbName]; reject(new Error('Ошибка сети. Проверьте доступ «всем по ссылке».')); };
    document.head.appendChild(script);
  });
}

// ============ Сравнение ============
function extractNormalizedRows(data, type) {
  const mapping = type === 'excel' ? getColumnMapping(data.headers) : null;
  return data.rows.map(r => {
    const get = (key, fallbackKey) => {
      if (type === 'google') return normalizeValue(r[key] || r[fallbackKey]);
      return normalizeValue(r[mapping[key]]);
    };
    
    return {
      __row: r.__row,
      id: normalizeId(type === 'google' ? r['id'] : r[mapping['id']]),
      'ФО': get('ФО'),
      'объект': get('объект'),
      'объект_norm': normalizeObject(get('объект')),
      'этап': get('этап'),
      'статус': get('статус'),
      'общая площадь': get('общая площадь'),
      'площадь строительства': get('площадь строительства'),
      'площадь блоков мезонина': get('площадь блоков мезонина'),
      'площадь оперзоны': get('площадь оперзоны'),
      'площадь заморозки': get('площадь заморозки'),
      'статус площадки': get('статус площадки'),
      'РВ': get('РВ'),
      'категория': get('категория'),
      'источник': type === 'google' ? normalizeValue(r['источник данных площади'] || r['источник']) : get('источник'),
      'повреждения': get('повреждения'),
    };
  });
}

function runComparison() {
  const left = state.leftData;
  const right = state.rightData;
  if (!left || !right) return;

  const leftSuffix = findLatestSuffix(left.headers);
  const rightSuffix = findLatestSuffix(right.headers);

  const gRows = extractNormalizedRows(left, left.type);
  const xRows = extractNormalizedRows(right, right.type);

  const FIELDS = [
    ['этап','Этап'], ['статус','Статус площади'],
    ['общая площадь','Общая площадь'],
    ['площадь строительства','Площадь объекта строительства'],
    ['площадь блоков мезонина','Площадь блоков мезонина'],
    ['площадь оперзоны','Площадь оперзоны'],
    ['площадь заморозки','Площадь заморозки'],
    ['статус площадки','Статус площадки'],
    ['РВ','Дата получения РВ'],
    ['категория','Категория объекта'],
    ['источник','Источник данных'],
    ['повреждения','Повреждение блока'],
  ];

  const pkey = r => `${r.id}|${r['ФО']}|${r['объект_norm']}`;
  const skey = r => `${r['этап'] || ''}|${r['категория'] || ''}`;

  const gGroups = {}, xGroups = {};
  gRows.forEach(r => (gGroups[pkey(r)] ||= []).push(r));
  xRows.forEach(r => (xGroups[pkey(r)] ||= []).push(r));

  const pairs = [], onlyG = [], onlyX = [];
  const allKeys = new Set([...Object.keys(gGroups), ...Object.keys(xGroups)]);

  for (const k of allKeys) {
    const g = gGroups[k] || [], x = xGroups[k] || [];
    const usedG = new Set(), usedX = new Set();

    for (let i = 0; i < g.length; i++) {
      for (let j = 0; j < x.length; j++) {
        if (usedX.has(j)) continue;
        if (skey(g[i]) === skey(x[j])) {
          pairs.push([g[i], x[j], 'exact']);
          usedG.add(i); usedX.add(j); break;
        }
      }
    }
    const rg = g.filter((_, i) => !usedG.has(i));
    const rx = x.filter((_, j) => !usedX.has(j));
    const minLen = Math.min(rg.length, rx.length);
    for (let i = 0; i < minLen; i++) pairs.push([rg[i], rx[i], 'fuzzy']);
    onlyG.push(...rg.slice(minLen));
    onlyX.push(...rx.slice(minLen));
  }

  const changes = [];
  for (const [gr, xr] of pairs) {
    for (const [fk, fl] of FIELDS) {
      if (!valuesEqual(gr[fk], xr[fk])) {
        changes.push({
          id: gr.id, fo: gr['ФО'], obj: gr['объект'],
          stage_old: gr['этап'], stage_new: xr['этап'],
          field: fl, old: gr[fk], new: xr[fk],
        });
      }
    }
  }

  const metaStr = (leftSuffix || rightSuffix) 
    ? `Даты: ${leftSuffix || 'нет'} ↔ ${rightSuffix || 'нет'} · Строк: ${gRows.length} ↔ ${xRows.length}`
    : `Строк: ${gRows.length} ↔ ${xRows.length}`;

  renderReport({ suffix: metaStr, gRows, xRows, pairs, changes, onlyG, onlyX, mode: state.mode });
}

  d.changes.forEach(ch => {
    const stageDisplay = ch.field === 'Этап' ? `${ch.old ?? ''} → ${ch.new ?? ''}` : (ch.stage_new || ch.stage_old || '');
    const row = c.addRow([ch.id, ch.fo, ch.obj, stageDisplay, ch.field, ch.old ?? '', ch.new ?? '']);

    row.getCell(7).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF0FDF4' } };
  });
  c.columns = [{ width: 12 }, { width: 15 }, { width: 20 }, { width: 30 }, { width: 24 }, { width: 20 }, { width: 20 }];

  const ox = wb.addWorksheet('Только справа');
  ox.addRow(['ID', 'ФО', 'Объект', 'Этап', 'Статус', 'Общая', 'Строит.', 'Категория', 'Источник']);
  ox.getRow(1).font = { bold: true };
  d.onlyX.forEach(r => {
    const row = ox.addRow([r.id, r['ФО'], r['объект'], r['этап'], r['статус'], r['общая площадь'] ?? '', r['площадь строительства'] ?? '', r['категория'], r['источник']]);
    row.eachCell(cell => cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF0FDF4' } });
  });

  const og = wb.addWorksheet('Только слева');
  og.addRow(['ID', 'ФО', 'Объект', 'Этап', 'Статус', 'Общая', 'Строит.', 'Категория', 'Источник']);
  og.getRow(1).font = { bold: true };
  d.onlyG.forEach(r => {
    const row = og.addRow([r.id, r['ФО'], r['объект'], r['этап'], r['статус'], r['общая площадь'] ?? '', r['площадь строительства'] ?? '', r['категория'], r['источник']]);
    row.eachCell(cell => cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFEF2F2' } });
  });

  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `report_${new Date().toISOString().slice(0, 10)}.xlsx`;
  a.click();
  URL.revokeObjectURL(url);
}

$('btn-run').onclick = runComparison;
$('btn-back').onclick = () => {
  $('screen-report').style.display = 'none';
  $('screen-upload').style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
};
$('btn-dl-xlsx').onclick = downloadXlsx;

</script>
</body>
